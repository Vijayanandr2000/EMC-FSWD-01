<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="1">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Gender</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Vijay</td>
          <td>abc@gmail.com</td>
          <td>Male</td>
        </tr>

        <tr>
          <td>Vijay</td>
          <td>abc@gmail.com</td>
          <td>Female</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td rowspan="2">Total</td>
          <td colspan="2">2</td>
        </tr>

        <tr>
          <td colspan="2">
            <input type="color">
          </td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>

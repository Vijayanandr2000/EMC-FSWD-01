<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS</title>

  <style>
    /* selector{
      property: value
    } */

    #red{
      color: red;
    }

    .blue{
      color: blue;
    }

    h1{
      color: purple !important;
    }



  </style>
</head>
<body>
  <h1>Vijay</h1>
  <h1 id="red" class="blue">Vijay</h1>
  <h1 class="blue">Vijay</h1>
  <h1>Vijay</h1>
  <h1>Vijay</h1>
  <h1 class="blue">Vijay</h1>

</body>
</html>
